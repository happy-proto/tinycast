name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26
        run: |
          XCODE_PATH="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$XCODE_PATH" ]; then
            echo "::error::No Xcode 26.x found on this runner"
            exit 1
          fi
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install development tools
        run: brew install swiftlint xcodegen

      - name: Check generated Xcode project
        run: |
          xcodegen generate
          git diff --exit-code -- Tinycast.xcodeproj

      - name: Run tests
        run: ./Scripts/run-tests.sh

      - name: Run lint
        run: ./Scripts/lint.sh

      - name: Check model imports
        run: |
          if grep -rln 'import AppKit\|import SwiftUI\|import Cocoa' Tinycast/Features/*/Model/; then
            echo "::error::Feature models must not import AppKit, SwiftUI, or Cocoa"
            exit 1
          fi

      - name: Build Debug app
        run: |
          xcodebuild \
            -project Tinycast.xcodeproj \
            -scheme Tinycast \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
